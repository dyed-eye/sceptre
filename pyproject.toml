[project]
name = "sceptre"
version = "0.2.0"
description = "S-matrix Cascading Eigenmode Propagation Through Rectangular Enclosures: Fourier modal method for closed PEC rectangular waveguides with dielectric obstacles"
readme = "README.md"
authors = [
    { name = "Kliment Semushev", email = "opened.chest@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = [
    "waveguide",
    "fourier-modal-method",
    "rcwa",
    "mode-matching",
    "electromagnetics",
    "s-matrix",
    "microwave",
    "resonance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "numba>=0.59",
    "threadpoolctl>=3.0",
]

[project.urls]
Repository = "https://github.com/dyed-eye/sceptre"
Documentation = "https://github.com/dyed-eye/sceptre/blob/main/docs/index.md"
Changelog = "https://github.com/dyed-eye/sceptre/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "matplotlib>=3.8",
    "mph>=1.2",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[tool.basedpyright]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast unit tests (mocked / analytic, no heavy solves)",
    "integration: slower physics tests (eigenproblems, contour searches)",
]
